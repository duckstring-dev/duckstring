[project]
name = "duckstring"
version = "0.8.0rc1"
description = "An open source data engineering platform for DuckDB: versioned transformations, pull orchestration, incremental processing and a built-in catalog."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Duckstring", email = "dev@duckstring.com" }
]

dependencies = [
  # The tested range: CI runs the suite on the floor (1.5, an LTS) and the latest release, and against the
  # pre-release in an allowed-to-fail job. Raise the ceiling once the suite passes on the next major's release
  # (plans/duckdb-2.md). A Pond environment gets this Duckstring, so these bounds hold there too.
  "duckdb>=1.5,<3",
  # The incremental engine (packages/trickle), released separately. A compatible range: while it's 0.x a
  # minor release can change its API or storage format, so Duckstring moves to one deliberately.
  "duckstring-trickle>=0.3.1,<0.4",
  "rich>=13.7",
  "typer>=0.12",
  "fastapi>=0.111",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "httpx>=0.25",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  # Arrow interchange: the Flight SQL server and Arrow fetches from DuckDB.
  "pyarrow>=14",
  # DuckDB requires pytz to convert TIMESTAMPTZ columns to Python datetimes on fetch
  # (our _duckstring_f freshness column is TIMESTAMPTZ, read back in dataplane/trickle export).
  # It is otherwise only present transitively (pandas), so a clean install lacks it.
  "pytz",
  # .pondignore matching with exact .gitignore semantics (negation, anchoring, **). Pure Python.
  "pathspec>=0.10",
  # Builds each Pond's own environment from its pyproject.toml + uv.lock (plans/pond-environments.md).
  # A self-contained binary wheel; duckstring.environments finds it with uv.find_uv_bin().
  "uv>=0.5",
]

[project.optional-dependencies]
# dbt-mode Ponds (plans/dbt.md): deploy a dbt project as a Pond, each model a Ripple. Heavyweight and
# opt-in — only pulled when a team actually runs dbt-mode. dbt-duckdb pulls dbt-core transitively.
dbt = [
  "dbt-duckdb>=1.9",
]
# Column lineage through .sql() escape hatches (plans/lineage.md Phase 3): a real SQL parser, opt-in --
# without it those outputs are honestly "opaque", never guessed. Pure python, light.
lineage = [
  "sqlglot>=23",
]
# AWS / cloud (plans/cloud-config.md): the object-store data plane + egress (s3fs — fsspec's small-file
# work; DuckDB does the bulk Parquet I/O over httpfs on its own), and the remote-compute launchers
# (EC2/Fargate/relay) + the Athena Flock engine (boto3, and sqlglot to translate its jobs). Opt-in: a
# local/offline Catchment needs none.
aws = [
  "s3fs>=2023.1",
  "boto3>=1.34",
  "sqlglot>=30.21,<31",
]
# Azure and Google Cloud (plans/azure-gcp.md): the fsspec half of an az:// / abfss:// or gs:// data root and
# Spouts (DuckDB's own azure and httpfs extensions do the Parquet I/O), plus each cloud's credential library.
# Remote compute on these clouds adds its SDKs here.
azure = [
  "adlfs>=2024.4",
  "azure-identity>=1.15",
  "azure-mgmt-appcontainers>=5.0",
  "azure-mgmt-compute>=34",
  "azure-monitor-query>=1.2",
  "sqlglot>=30.21,<31",  # the Databricks Flock engine translates jobs on the -azure Duck image
]
gcp = [
  "gcsfs>=2024.2",
  "google-auth[requests]>=2.20",
  "sqlglot>=30.21,<31",  # the BigQuery Flock engine translates jobs (plans/databricks-bigquery.md)
]
# Databricks (plans/databricks-bigquery.md): the Databricks SQL Flock engine, the Databricks Spout and Volumes
# reached through the Files API (a Databricks App), over the REST APIs with httpx and pyarrow (both core).
# sqlglot translates Flock jobs, fsspec carries the Volume filesystem; on Azure an Entra token comes from
# azure-identity (the azure extra).
databricks = [
  "sqlglot>=30.21,<31",
  "fsspec>=2023.1",
]
# The StarRocks Flock engine (plans/flock-coverage.md): the MySQL-protocol client, and sqlglot to translate
# jobs. sqlglot is pinned to one major because what an engine is trusted with is measured against its
# translations: re-run tests/test_flock_starrocks_conformance.py before widening it.
starrocks = [
  "pymysql>=1.1",
  "sqlglot>=30.21,<31",
]
dev = [
  "pytest>=8.0",
  # A local S3 API, so the object-store data plane is a normal test rather than a live-AWS session.
  "moto[server]>=5.0",
  "pytest-timeout>=0.5",
  "ruff>=0.3",
  "mypy>=1.8",
  "dbt-duckdb>=1.9",
  "sqlglot>=30.21,<31",
  "s3fs>=2023.1",
  "boto3>=1.34",
  "adlfs>=2024.4",
  "azure-identity>=1.15",
  "azure-mgmt-appcontainers>=5.0",
  "azure-mgmt-compute>=34",
  "azure-monitor-query>=1.2",
  "gcsfs>=2024.2",
  "google-auth[requests]>=2.20",
  "pg8000>=1.31",
  "pymysql>=1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"duckstring.catchment" = ["static/**/*", "schema/*.sql"]
"duckstring" = ["demo/**/*", "demo/**/.gitignore"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["packages/trickle"]

[tool.uv.sources]
duckstring-trickle = { workspace = true }

[project.urls]
Homepage = "https://duckstring.com"
Documentation = "https://docs.duckstring.com"
Repository = "https://github.com/duckstring-dev/duckstring"
Playground = "https://playground.duckstring.com"

[project.scripts]
duckstring = "duckstring.cli:main"
ds = "duckstring.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/trickle/tests"]
# Some suites share fixtures by importing `tests.<module>`; put the repo root on the path so a bare
# `pytest` (what CI runs) resolves them the same as `python -m pytest`.
pythonpath = ["."]
# Tight enough to catch an accidental real sleep (sim tests finish in ms), loose enough to absorb
# cold-runner I/O on CI (SQLite migrate / uvicorn startup can exceed 1s on shared runners).
timeout = 5

[tool.ruff]
line-length = 128
target-version = "py310"
extend-exclude = ["experiment"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # typer.Option/Argument in defaults is intentional

[tool.ruff.lint.isort]
# Explicit, because ruff versions disagree on modules that only resolve through an alias: newer ones class
# duckstring.trickle.* (now packages/trickle, aliased) as third-party. `trickle` itself is third-party here.
known-first-party = ["duckstring"]
