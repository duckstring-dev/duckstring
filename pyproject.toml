[project]
name = "duckstring"
version = "0.6.1"
description = "An open source data engineering platform for DuckDB: versioned transformations, pull orchestration, incremental processing and a built-in catalog."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Duckstring", email = "dev@duckstring.com" }
]

dependencies = [
  # The tested range: CI runs the suite on the floor and the latest release, and against the pre-release
  # in an allowed-to-fail job. Raise the ceiling once the suite passes on the next major's release
  # (plans/duckdb-2-ready.md). A Pond environment gets this Duckstring, so these bounds hold there too.
  "duckdb>=1.5,<2",
  "rich>=13.7",
  "typer>=0.12",
  "fastapi>=0.111",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "httpx>=0.25",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  # Arrow interchange: the Flight SQL server and Arrow fetches from DuckDB.
  "pyarrow>=14",
  # DuckDB requires pytz to convert TIMESTAMPTZ columns to Python datetimes on fetch
  # (our _duckstring_f freshness column is TIMESTAMPTZ, read back in dataplane/trickle export).
  # It is otherwise only present transitively (pandas), so a clean install lacks it.
  "pytz",
  # .pondignore matching with exact .gitignore semantics (negation, anchoring, **). Pure Python.
  "pathspec>=0.10",
  # Builds each Pond's own environment from its pyproject.toml + uv.lock (plans/pond-environments.md).
  # A self-contained binary wheel; duckstring.environments finds it with uv.find_uv_bin().
  "uv>=0.5",
]

[project.optional-dependencies]
# dbt-mode Ponds (plans/dbt.md): deploy a dbt project as a Pond, each model a Ripple. Heavyweight and
# opt-in — only pulled when a team actually runs dbt-mode. dbt-duckdb pulls dbt-core transitively.
dbt = [
  "dbt-duckdb>=1.9",
]
# Column lineage through .sql() escape hatches (plans/lineage.md Phase 3): a real SQL parser, opt-in --
# without it those outputs are honestly "opaque", never guessed. Pure python, light.
lineage = [
  "sqlglot>=23",
]
# AWS / cloud (plans/cloud-config.md): the object-store data plane + egress (s3fs — fsspec's small-file
# work; DuckDB does the bulk Parquet I/O over httpfs on its own), and the remote-compute launchers
# (EC2/Fargate/relay) + the Athena Flock engine (boto3). Opt-in — a local/offline Catchment needs none.
aws = [
  "s3fs>=2023.1",
  "boto3>=1.34",
]
dev = [
  "pytest>=8.0",
  # A local S3 API, so the object-store data plane is a normal test rather than a live-AWS session.
  "moto[server]>=5.0",
  "pytest-timeout>=0.5",
  "ruff>=0.3",
  "mypy>=1.8",
  "dbt-duckdb>=1.9",
  "sqlglot>=23",
  "s3fs>=2023.1",
  "boto3>=1.34",
  "pg8000>=1.31",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"duckstring.catchment" = ["static/**/*", "schema/*.sql"]
"duckstring" = ["demo/**/*", "demo/**/.gitignore"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://duckstring.com"
Documentation = "https://docs.duckstring.com"
Repository = "https://github.com/duckstring-dev/duckstring"
Playground = "https://playground.duckstring.com"

[project.scripts]
duckstring = "duckstring.cli:main"
ds = "duckstring.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some suites share fixtures by importing `tests.<module>`; put the repo root on the path so a bare
# `pytest` (what CI runs) resolves them the same as `python -m pytest`.
pythonpath = ["."]
# Tight enough to catch an accidental real sleep (sim tests finish in ms), loose enough to absorb
# cold-runner I/O on CI (SQLite migrate / uvicorn startup can exceed 1s on shared runners).
timeout = 5

[tool.ruff]
line-length = 128
target-version = "py310"
extend-exclude = ["experiment"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # typer.Option/Argument in defaults is intentional
