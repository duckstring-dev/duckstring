name: Release

# Tag a release (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build and publish to PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC) — configure the `pypi` environment for this repo
# and register the publisher on PyPI (project: duckstring, workflow: release.yml, environment: pypi).

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The web UI is CI-built (src/duckstring/catchment/static/ is gitignored) — a wheel built
      # without this step would silently ship without the UI.
      - run: npm ci
        working-directory: frontend
      - run: make build-frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # Fail loudly if the wheel is missing its data files (UI or schema).
      - name: Verify wheel contents
        run: |
          wheel=$(ls dist/*.whl)
          unzip -l "$wheel" | grep -q "duckstring/catchment/static/index.html" || { echo "wheel missing web UI"; exit 1; }
          unzip -l "$wheel" | grep -q "duckstring/catchment/schema/001_init.sql" || { echo "wheel missing schema"; exit 1; }
          # Subpath hosting: the UI must reference its assets relatively, never origin-absolute.
          if grep -qE '(src|href)="/' src/duckstring/catchment/static/index.html; then
            echo "web UI has origin-absolute asset paths (breaks subpath hosting)"; exit 1
          fi
      - name: Verify tag matches package version
        run: |
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$pkg_version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package v$pkg_version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The official Duck image (plans/pond-environments.md), public at ghcr.io/duckstring-dev/duckstring: what a
  # Fargate Duck runs unless the operator builds their own. Built from the same wheel the PyPI release uses,
  # for both Fargate architectures (X86_64 and ARM64), and tagged with the bare version only (0.6.0, as on
  # PyPI). No `latest`: a Duck must run the same Duckstring as its Catchment, so it's always pinned.
  # GITHUB_TOKEN is enough to push (packages: write). The package's visibility is a one-time setting on
  # GitHub (Package settings -> Change visibility -> Public); it can't be set from here.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
