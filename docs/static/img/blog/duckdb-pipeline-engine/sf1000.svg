<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" width="720" height="140" role="img" aria-label="The pipeline at 1 TB on AWS: DuckDB 166 s, StarRocks 622 s, Spark 1,605 s as run and about 1,000 s if tuned" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
