<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="The pipeline: two Ponds land the data, one joins it, three aggregate it" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The pipeline: two Ponds land the data, one joins it, three aggregate it</title>
<rect y="0" width="720" height="260" rx="8" fill="#1a1a19"/>
<defs><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="ah-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a897f"/></marker></defs>
<rect x="20.0" y="52.0" width="170" height="46" rx="8" fill="#242422" stroke="#8a897f" stroke-width="1.5"/><text x="105.0" y="73.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">sales_feed</text><text x="105.0" y="88.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">store_sales, store_returns</text>
<rect x="20.0" y="152.0" width="170" height="46" rx="8" fill="#242422" stroke="#8a897f" stroke-width="1.5"/><text x="105.0" y="173.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">dimensions</text><text x="105.0" y="188.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">five dimensions</text>
<rect x="260.0" y="102.0" width="170" height="46" rx="8" fill="#242422" stroke="#3987e5" stroke-width="1.5"/><text x="345.0" y="123.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">sales_enriched</text><text x="345.0" y="138.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">joined</text>
<rect x="505.0" y="22.0" width="190" height="46" rx="8" fill="#242422" stroke="#8a897f" stroke-width="1.5"/><text x="600.0" y="43.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">category_month</text><text x="600.0" y="58.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">by category and month</text>
<line x1="430.0" y1="125.0" x2="503.0" y2="45.0" stroke="#8a897f" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="505.0" y="102.0" width="190" height="46" rx="8" fill="#242422" stroke="#8a897f" stroke-width="1.5"/><text x="600.0" y="123.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">store_quarter</text><text x="600.0" y="138.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">by store and quarter</text>
<line x1="430.0" y1="125.0" x2="503.0" y2="125.0" stroke="#8a897f" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<rect x="505.0" y="182.0" width="190" height="46" rx="8" fill="#242422" stroke="#8a897f" stroke-width="1.5"/><text x="600.0" y="203.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">customer_value</text><text x="600.0" y="218.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">by customer and state</text>
<line x1="430.0" y1="125.0" x2="503.0" y2="205.0" stroke="#8a897f" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<line x1="190.0" y1="75.0" x2="258.0" y2="118.0" stroke="#8a897f" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<line x1="190.0" y1="175.0" x2="258.0" y2="132.0" stroke="#8a897f" stroke-width="1.5" marker-end="url(#ah-muted)"/>
<text x="105.0" y="245.0" font-size="11" fill="#8a897f" text-anchor="middle" font-weight="400">ingested</text>
<text x="600.0" y="245.0" font-size="11" fill="#8a897f" text-anchor="middle" font-weight="400">aggregated</text>
</svg>
